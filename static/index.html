<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>ECONEXUS_WAREHOUSE</title>
  <link rel="icon" href="/icons/logo.svg">
  <!-- Font IBM Plex từ Google Fonts cho chữ đẹp (cần mạng; không có mạng vẫn chạy với font hệ thống) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><span class="mark"><span class="ic" style="--i:url(/icons/logo.svg)"></span></span>
      <span><b>ECONEXUS_WAREHOUSE</b><small>Quản lý kho theo lô và hạn dùng</small></span></a>
    <button class="btn ghost" id="userBtn" aria-label="Tài khoản" hidden></button>
  </header>

  <nav id="nav" class="nav"></nav>   <!-- dải menu, app.js điền vào -->
  <main id="view"></main>            <!-- nội dung từng trang -->

  <aside id="drawer" class="drawer" aria-label="Chi tiết" hidden></aside>   <!-- ngăn chi tiết bên phải -->
  <div id="modal" class="modal"></div>
  <div id="toast" class="toast"></div>

  <!-- Three.js cho kho 3D: chỉ tải khi mở chế độ 3D (cần mạng; không có mạng thì trang Sơ đồ kho tự về 2D) -->
  <script type="importmap">{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  } }</script>
  <!-- type="module": cho phép tách code JS ra nhiều file và import lẫn nhau -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
